<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widzew 1910 — test interfejsu meczu</title><style>body{margin:0;background:#101010;color:#eee;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:20px}.box{background:#191919;border:1px solid #333;border-radius:14px;padding:16px;margin:12px 0}.score{display:grid;grid-template-columns:1fr 160px 1fr;align-items:center;text-align:center}.team{font-size:22px;font-weight:bold}.team img{width:60px;height:60px;object-fit:contain;display:block;margin:auto}.scoreline{font-size:42px;font-weight:900}.minute{font-size:20px;font-weight:bold}.event{font-size:24px;font-weight:bold;line-height:1.35;min-height:70px}.meta,.status{color:#aaa;font-size:13px;margin-top:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.action{background:#292929;color:#fff;border:1px solid #555;border-radius:9px;padding:13px;text-align:left;cursor:pointer}.action:hover:not(:disabled){border-color:#aaa}.action:disabled{opacity:.45;cursor:not-allowed}.name{font-weight:800}.chance{color:#bbb;margin-top:6px}.chance b{color:#fff}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.primary{background:#e30613;color:#fff}.layout{display:grid;grid-template-columns:1fr 300px;gap:12px}.feed{max-height:350px;overflow:auto}.row{padding:7px 0;border-bottom:1px solid #292929}.debug{white-space:pre-wrap;font:12px Consolas,monospace;color:#aaa;max-height:250px;overflow:auto}@media(max-width:700px){.layout{grid-template-columns:1fr}.score{grid-template-columns:1fr 100px 1fr}.team{font-size:16px}.actions{grid-template-columns:1fr}.event{font-size:20px}}</style></head><body><main><div class="box score"><div id="home" class="team"></div><div><div id="score" class="scoreline">0 : 0</div><div id="minute" class="minute">—'</div></div><div id="away" class="team"></div></div><div class="layout"><section><div class="box"><h2>Aktualna sytuacja</h2><div id="event" class="event">Kliknij „Rozpocznij mecz”.</div><div id="meta" class="meta"></div><div id="actions" class="actions"></div></div><div class="box"><h3>Przebieg meczu</h3><div id="feed" class="feed"></div></div></section><aside><div class="box"><div class="controls"><button id="start" class="primary">▶ Rozpocznij mecz</button><button id="reset">↻ Nowy mecz</button><button id="secondHalf" class="primary" hidden>▶ Rozegraj drugą połowę</button><button id="finishMatch" class="primary" hidden>✓ Zakończ mecz</button></div><div id="status" class="status"></div></div><div class="box"><h3>Strzelcy Widzewa</h3><div id="scorers">Brak bramek.</div></div><div class="box"><h3>Debug</h3><div id="debug" class="debug">Oczekiwanie na start.</div></div></aside></div></main><script src="./season-match-engine.js?v=15"></script><script src="./season-match-engine-6c-extension.js?v=15"></script><script src="./season-match-engine-6d-extension.js?v=15"></script><script src="./season-match-engine-6e-extension.js?v=15"></script><script>(function(){'use strict';const $=id=>document.getElementById(id),E=()=>window.WidzewSeasonMatchEngine;const PLAYER={name:'Zawodnik testowy',stats:{defensywa:50,szybkosc:50,podania:50,atak:50,zaangazowanie:50,kreatywnosc:50,strzal:50,ogolna:50,graNogami:50,piastkowanie:50,robinsonada:50,br:50}};const XI=Array.from({length:10},(_,i)=>({...PLAYER,slot:i+1}));const TEAM={w:{name:'Widzew Łódź',logo:'./data/logos/widzew_lodz.png'},l:{name:'Legia Warszawa',logo:'./data/logos/legia_warszawa.png'}};let actions={},events={},comms={},current=null,currentPlayer=null,locked=false,state=null,k={eventGroup:null,repeatCount:0,k:0},clockTimer=null;const REG=[{a:1,b:15,w:12.70},{a:16,b:30,w:13.90},{a:31,b:45,w:15.89},{a:46,b:60,w:16.20},{a:61,b:75,w:15.13},{a:76,b:90,w:15.89}];function pick(a){let t=a.reduce((s,x)=>s+x.w,0),r=Math.random()*t;for(const x of a){r-=x.w;if(r<0)return x}return a[a.length-1]}function rndRegularMinute(){const x=pick(REG);return x.a+Math.floor(Math.random()*(x.b-x.a+1))}function rndStoppageHalf(){return 1+Math.floor(Math.random()*5)}function rndStoppageFull(){return 1+Math.floor(Math.random()*8)}function mv(x){const s=String(x);if(s.includes('+')){const p=s.split('+');return Number(p[0])+Number(p[1])}return parseFloat(s)}function minuteSeconds(x){return mv(x)*60}function formatClock(seconds){return Math.floor(Math.max(0,seconds)/60)+"'"}function minutes(n){return Array.from({length:n},()=>rndRegularMinute()).sort((a,b)=>mv(a)-mv(b))}function side(id){return Number(id)>=100?'DEF':'OF'}function actionData(id){return actions[String(id)]||null}function eventData(id){const n=Number(id);if(n===10||n===110)return events.special&&events.special[String(id)];return events[side(id)]&&events[side(id)][String(id)]}function actionName(id){const x=actionData(id);return x&&x.name?x.name:'Akcja '+id}function eventText(ev){const x=eventData(ev.eventId);if(!x)return'Event '+ev.eventId;let s=x.name;s=s.replace(/Zawodnik XY/g,currentPlayer?currentPlayer.name:PLAYER.name);if(ev.z!=null)s=s.replace(/Z m/g,ev.z+' m');else s=s.replace(/ Z m/g,'');return s}function commName(id){if(!id)return'';const key=String(id),g=key.startsWith('99.')?'DEF':key.startsWith('9.')?'OF':null,x=g&&comms[g]&&comms[g][key];return x&&x.name?x.name:key}function renderTeams(){$('home').innerHTML='<img src="'+TEAM.w.logo+'">'+TEAM.w.name;$('away').innerHTML='<img src="'+TEAM.l.logo+'">'+TEAM.l.name}function score(){$('score').textContent=state.score.widzew+' : '+state.score.opponent;$('minute').textContent=state.clockSeconds==null?'—':formatClock(state.clockSeconds)}function feed(text,minuteOverride){const m=minuteOverride!==undefined?minuteOverride:(state&&state.minute!=null?state.minute:null);$('feed').insertAdjacentHTML('afterbegin','<div class="row">'+(m!=null?'<b>'+m+"'</b> ":'')+text+'</div>')}function systemFeed(text,minuteOverride){feed('<strong>'+text+'</strong>',minuteOverride)}function scorers(){$('scorers').innerHTML=state.scorers.length?state.scorers.map(x=>'<div>'+x.player+' — '+x.minute+"'</div>").join(''):'Brak bramek.'}function choosePlayerForAction(id){const type=actionData(id)?.type;if(type==='pass'||type==='cross'){let p;do{p=XI[Math.floor(Math.random()*XI.length)]}while(currentPlayer&&p.slot===currentPlayer.slot);return p}return currentPlayer||XI[Math.floor(Math.random()*XI.length)]}function makeEvent(id,z){return{eventId:Number(id),side:side(id),z:z==null?null:Number(z)}}function zForEvent(id){const n=Number(id);if([3,7,103,107,10,110].includes(n))return null;const first={1:'1.1',2:'2.1',4:'4.1',5:'5.1',6:'6.1',8:'8.1',101:'101.1',102:'102.1',104:'104.1',105:'105.1',106:'106.1',108:'108.1'}[n];return first&&E().chooseZ?E().chooseZ(n,first,Math.random):null}function nextFrom(t){if(!t)return null;let id=t.nextEvent;if(id==null&&t.nextAction!=null)id=Number(t.nextAction);if(id==null)return null;const z=t.newZ!==undefined?t.newZ:zForEvent(id);return makeEvent(id,z)}function render(){if(!current){$('event').textContent='';$('meta').textContent='';$('actions').innerHTML='';return} $('event').textContent=eventText(current);$('meta').textContent='Event '+current.eventId+' · '+current.side+' · Z = '+(current.z==null?'—':current.z)+' · '+state.minute+"'";let list=E().availableActions(current.eventId,current.z)||[];if(Number(current.eventId)===104&&list.length===0){list=['104.1','104.2'];$('meta').textContent+=' · akcje testowe odblokowane';}$('actions').innerHTML='';list.forEach(id=>{const p=E().calculateActionProbability(String(id),{z:current.z,performerStats:currentPlayer.stats,opponentStats:PLAYER.stats,k:k.k});const b=document.createElement('button');b.className='action';b.innerHTML='<div class="name">'+actionName(id)+'</div><div class="chance">Szansa powodzenia: <b>'+p.probability.toFixed(1)+'%</b></div>';b.onclick=()=>play(String(id));$('actions').appendChild(b)})}function lock(){locked=true;document.querySelectorAll('.action').forEach(x=>x.disabled=true)}function goal(msg){if(msg==='9.10'){state.score.widzew++;state.scorers.push({player:currentPlayer?.name||PLAYER.name,minute:state.minute})}if(msg==='99.10')state.score.opponent++;score();scorers()}function finishSequence(){current=null;currentPlayer=null;locked=false;advance()}function resolveSpecial(ev){const id=String(ev.eventId);if(id!=='10'&&id!=='110')return false;const result=E().resolveAction(id,{z:ev.z,performerStats:PLAYER.stats,opponentStats:PLAYER.stats,randomFn:Math.random});const t=E().transitionForAction(id,result.success,ev.z,Math.random);const msg=t?.message?commName(t.message):actionName(id);feed(msg);if(t?.message)goal(String(t.message));$('debug').textContent=JSON.stringify({specialEvent:id,probability:result.probability,roll:result.roll,success:result.success,transition:t,message:msg},null,2);if(t?.end){finishSequence();return true}const nx=nextFrom(t);if(nx){current=nx;currentPlayer=XI[Math.floor(Math.random()*XI.length)];locked=false;render();return true}finishSequence();return true}function testTransitionForAction(id,success,z){const sid=String(id);if(sid!=='101.1'&&sid!=='102.1'&&!['108.1','108.2','108.3'].includes(sid))return E().transitionForAction(id,success,z,Math.random);const eventId=sid==='101.1'?101:102;const nextNormal=Number(z)<=16?108:eventId;const r=Math.random();if(sid==='108.1'||sid==='108.2'||sid==='108.3'){if(success)return E().transitionForAction(id,success,z,Math.random);const weighted=r*220;if(weighted<60)return{message:'99.13',nextEvent:103,testOverride:true};if(weighted<140)return{message:'99.14',nextEvent:110,testOverride:true};if(weighted<170)return{message:'99.2',end:true,testOverride:true};return{message:'99.11',nextEvent:107,testOverride:true}}if(success){const weighted=r*140;if(weighted<80)return{message:'99.7',nextEvent:nextNormal,testOverride:true};if(weighted<110)return{message:'99.3',end:true,testOverride:true};return{message:'99.4',end:true,testOverride:true}}const shotChance=typeof E().defensiveShotChance==='function'?E().defensiveShotChance(z):0;const shotRoll=Math.random();if(shotRoll<shotChance){const shotMessage=typeof E().rollDefensiveShot==='function'?E().rollDefensiveShot(z,Math.random):null;if(shotMessage==='99.1')return{message:'99.1',nextEvent:110,testOverride:true};return{message:'99.2',end:true,testOverride:true}}return{message:'99.6',nextEvent:nextNormal,testOverride:true}}function play(id){if(locked||!current)return;lock();try{const performer=choosePlayerForAction(id);const p=E().resolveAction(id,{z:current.z,performerStats:performer.stats,opponentStats:PLAYER.stats,k:k.k,randomFn:Math.random});k=E().updateKState(k,current.eventId);const t=testTransitionForAction(id,p.success,current.z);const msg=t?.message?commName(t.message):'';if(msg)feed(msg);if(t?.message)goal(String(t.message));$('debug').textContent=JSON.stringify({action:id,name:actionName(id),type:actionData(id)?.type,probability:p.probability,roll:p.roll,success:p.success,transition:t},null,2);if(t?.end){finishSequence();return}const nx=nextFrom(t);if(!nx){finishSequence();return}if(nx.eventId===10||nx.eventId===110){resolveSpecial(nx);return}current=nx;currentPlayer=(actionData(id)?.type==='pass'||actionData(id)?.type==='cross')?XI[Math.floor(Math.random()*XI.length)]:performer;if(t?.keepPlayer)currentPlayer=performer;locked=false;render();$('status').textContent='Wybierz kolejną akcję.'}catch(err){locked=false;$('status').textContent='Błąd akcji: '+err.message;$('debug').textContent=err.stack||String(err);render()}}function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null}}function animateClockTo(target,done){stopClock();if(!state)return;const targetSeconds=minuteSeconds(target),startSeconds=state.clockSeconds==null?0:state.clockSeconds;if(targetSeconds<=startSeconds+0.01){state.clockSeconds=targetSeconds;score();if(done)done();return}const distance=targetSeconds-startSeconds,duration=Math.min(2200,Math.max(700,distance*18)),started=performance.now();clockTimer=setInterval(()=>{const elapsed=performance.now()-started,progress=Math.min(1,elapsed/duration),smooth=progress<.5?2*progress*progress:1-Math.pow(-2*progress+2,2)/2;state.clockSeconds=startSeconds+distance*smooth;score();if(progress>=1){stopClock();state.clockSeconds=targetSeconds;score();if(done)done()}},30)}function showSequence(x){state.minute=x.minute;current=makeEvent(x.eventId,x.z);currentPlayer=XI[Math.floor(Math.random()*XI.length)];k={eventGroup:null,repeatCount:0,k:0};render();locked=false;$('status').textContent='Wybierz akcję.';feed('Początek sekwencji: '+eventText(current),state.minute)}function endHalf(){state.halftimePaused=true;current=null;currentPlayer=null;locked=true;$('actions').innerHTML='';$('event').textContent='KONIEC I POŁOWY';$('meta').textContent='';$('status').textContent='Przerwa. Rozegraj drugą połowę.';systemFeed('KONIEC I POŁOWY',state.halfEnd);$('secondHalf').hidden=false;score()}function simulateToFinish(){current=null;currentPlayer=null;locked=true;$('actions').innerHTML='';$('event').textContent='';$('meta').textContent='';$('status').textContent='Dogrywamy czas do końca meczu…';animateClockTo(state.fullEnd,()=>{state.minute=state.fullEnd;score();systemFeed('KONIEC CZASU GRY',state.fullEnd);$('event').textContent='KONIEC CZASU GRY';$('status').textContent='Czas meczu dobiegł końca. Możesz zakończyć mecz.';$('finishMatch').hidden=false})}function endMatch(){stopClock();current=null;currentPlayer=null;locked=true;$('actions').innerHTML='';$('event').textContent='MECZ GOTOWY DO ZAKOŃCZENIA';$('status').textContent='Wynik i strzelcy są gotowi do zapisania.';$('finishMatch').hidden=false}function advance(){if(!state||state.halftimePaused||state.finished)return;if(state.i>=state.seq.length){if(!state.secondHalfStarted){$('status').textContent='Dogrywamy czas do końca I połowy…';animateClockTo(state.halfEnd,()=>{state.minute=state.halfEnd;endHalf()});return}simulateToFinish();return}const x=state.seq[state.i++];if(!state.secondHalfStarted&&minuteSeconds(x.minute)>minuteSeconds(45)){state.i--;$('status').textContent='Dogrywamy czas do końca I połowy…';animateClockTo(state.halfEnd,()=>{state.minute=state.halfEnd;endHalf()});return}animateClockTo(x.minute,()=>showSequence(x))}function startSecondHalf(){if(!state||!state.halftimePaused)return;state.halftimePaused=false;state.secondHalfStarted=true;$('secondHalf').hidden=true;$('status').textContent='Druga połowa rozpoczęta.';advance()}function finalizeMatch(){if(!state||state.finished)return;stopClock();state.finished=true;state.finalResult={home:TEAM.w.name,away:TEAM.l.name,score:{...state.score},scorers:state.scorers.map(x=>({...x})),halfEnd:state.halfEnd,fullEnd:state.fullEnd};try{localStorage.setItem('widzew1910:lastMatchResult',JSON.stringify(state.finalResult))}catch(e){}$('finishMatch').hidden=true;$('secondHalf').hidden=true;$('event').textContent='MECZ ZAKOŃCZONY';$('status').textContent='Wynik i strzelcy zapisane jako wynik ostatniego meczu testowego.';systemFeed('MECZ ZAKOŃCZONY',state.fullEnd);$('debug').textContent=JSON.stringify({finalResult:state.finalResult,storageKey:'widzew1910:lastMatchResult'},null,2)}function start(){try{stopClock();const eng=E();if(!eng?.generateMatch)throw Error('Nie załadowano silnika');const g=eng.generateMatch({widzew:{overall:72,players:[]},opponent:{overall:75,charakter:7},overallDiff:-3,coachStrength:-.6,home:true,charakter:7,midfieldDiff:10,defenceDiff:5});if(!g.events?.length)throw Error('Silnik nie wygenerował eventów');const mins=minutes(g.events.length);state={score:{widzew:0,opponent:0},scorers:[],seq:g.events.map((e,i)=>({eventId:Number(e.eventId),z:e.z,minute:mins[i]})).sort((a,b)=>mv(a.minute)-mv(b.minute)),i:0,minute:null,clockSeconds:0,halfEnd:'45+'+rndStoppageHalf(),fullEnd:'90+'+rndStoppageFull(),halftimePaused:false,secondHalfStarted:false,finished:false,finalResult:null};$('feed').innerHTML='';$('secondHalf').hidden=true;$('finishMatch').hidden=true;$('status').textContent='Mecz rozpoczęty.';systemFeed('POCZĄTEK MECZU',0);score();advance();$('debug').textContent=JSON.stringify({generatedEvents:g.events.length,halfEnd:state.halfEnd,fullEnd:state.fullEnd,sequence:state.seq},null,2)}catch(err){$('status').textContent='Błąd: '+err.message;$('debug').textContent=err.stack||String(err)}}function reset(){stopClock();$('feed').innerHTML='';$('event').textContent='Kliknij „Rozpocznij mecz”.';$('meta').textContent='';$('actions').innerHTML='';$('score').textContent='0 : 0';$('minute').textContent="—'";$('status').textContent='';$('scorers').textContent='Brak bramek.';$('debug').textContent='Oczekiwanie na start.';$('secondHalf').hidden=true;$('finishMatch').hidden=true;state=null;current=null;locked=false}Promise.all([fetch('./data/akcje.json?v=6').then(r=>r.json()),fetch('./data/eventy.json?v=6').then(r=>r.json()),fetch('./data/komunikaty.json?v=6').then(r=>r.json())]).then(([a,e,c])=>{actions=a;events=e;comms=c;$('status').textContent='Bazy załadowane.'}).catch(e=>$('status').textContent='Błąd baz: '+e.message);$('start').onclick=start;$('reset').onclick=reset;$('secondHalf').onclick=startSecondHalf;$('finishMatch').onclick=finalizeMatch;renderTeams()})();</script></body></html>
