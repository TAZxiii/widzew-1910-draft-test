<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Widzew 1910 — test silnika</title><style>body{font-family:Arial;background:#111;color:#eee;padding:20px}main{max-width:1000px;margin:auto}.panel{background:#1d1d1d;border:1px solid #444;border-radius:10px;padding:16px;margin:12px 0}button{font-size:16px;padding:10px;margin-right:8px;cursor:pointer}pre{white-space:pre-wrap;background:#080808;padding:14px}.error{color:#ff8080;font-weight:bold}</style></head><body><main><h1>Widzew 1910 — test silnika meczu</h1><div class="panel">Tester korzysta bezpośrednio z aktualnego API silnika.</div><div class="panel"><button id="one">GENERUJ MECZ</button><button id="many">1000 MECZÓW</button></div><div class="panel"><div id="summary"></div><pre id="output">Gotowy.</pre></div><script src="season-match-engine.js?v=4"></script><script>const $=id=>document.getElementById(id);const cfg=()=>({widzew:{overall:72,players:[]},opponent:{overall:75,charakter:7},overallDiff:-3,coachStrength:.6,home:true,charakter:7,midfieldDiff:0,defenceDiff:0});function run(f){try{f()}catch(e){$('summary').className='error';$('summary').textContent='BŁĄD: '+e.message;$('output').textContent=e.stack||e}}function one(){run(()=>{const x=window.WidzewSeasonMatchEngine.generateMatch(cfg());$('summary').textContent=`Eventów: ${x.totalEvents} | OF: ${(x.ofShare*100).toFixed(1)}% | DEF: ${((1-x.ofShare)*100).toFixed(1)}% | Wynik: ${x.score.widzew}:${x.score.opponent}`;$('output').textContent=x.events.map(e=>`${e.minute}' | ${e.side} | event ${e.eventId} | akcja ${e.actionId} | Z=${e.z===null?'—':e.z} | K=${e.k}`).join('\n')||'Brak eventów.'})}function many(){run(()=>{let t=0,o=0,d=0,w=0,r=0;for(let i=0;i<1000;i++){const x=window.WidzewSeasonMatchEngine.generateMatch(cfg());t+=x.totalEvents;o+=x.events.filter(e=>e.side==='OF').length;d+=x.events.filter(e=>e.side==='DEF').length;w+=x.score.widzew;r+=x.score.opponent)}$('summary').textContent=`1000 meczów | średnio eventów: ${(t/1000).toFixed(2)} | OF: ${(100*o/(o+d)).toFixed(2)}% | DEF: ${(100*d/(o+d)).toFixed(2)}% | gole: ${w}:${r}`;$('output').textContent='Test zakończony.'})}$('one').onclick=one;$('many').onclick=many;</script></main></body></html>
