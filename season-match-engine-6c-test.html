<!doctype html><html lang="pl"><meta charset="utf-8"><title>Widzew 1910 — tester 6C</title><style>body{font:16px Arial;background:#111;color:#eee;padding:20px;max-width:1000px;margin:auto}button{padding:10px;margin:4px;cursor:pointer}.box{border:1px solid #555;padding:15px;margin:12px 0}pre{background:#000;padding:15px;white-space:pre-wrap}.err{color:#ff7777}</style><h1>Tester ETAP 6C — matematyka akcji</h1><div class="box"><b>Niezależny tester.</b><br>Zawodnik testowy; wszystkie statystyki = 50.</div><div class="box"><button id="new">🎲 NOWY EVENT</button><div id="status">Ładowanie...</div><div id="event">—</div><div id="actions"></div></div><div class="box">Stan K: <b id="k">—</b></div><div class="box"><pre id="out">—</pre></div>
<script src="./season-match-engine.js?v=11"></script><script src="./season-match-engine-6c-extension.js?v=2"></script><script>
(function(){'use strict';
const $=id=>document.getElementById(id); const E=window.WidzewSeasonMatchEngine; let A={},EV={},ready=false,ev=null,kstate=null;
const stats={defensywa:50,szybkosc:50,podania:50,atak:50,zaangazowanie:50,kreatywnosc:50,strzal:50,ogolna:50,obrona:50,pomoc:50,br:50,graNogami:50,piastkowanie:50,robinsonada:50};
function setStatus(t,err){$('status').textContent=t;$('status').className=err?'err':''}
function eventName(e){const g=e.side==='OF'?'OF':'DEF',x=EV[g]&&EV[g][String(e.eventId)];if(!x)return 'Event '+e.eventId;return x.name.replace(/Zawodnik XY/g,'Zawodnik testowy').replace(/Z m/g,e.z==null?'—':e.z+' m')}
function next(){try{if(!ready)throw Error('Bazy danych jeszcze się nie załadowały.');const m=E.generateMatch({widzew:{overall:65,players:[]},opponent:{overall:65,charakter:5},home:true});if(!m.events||!m.events.length)throw Error('Silnik nie wygenerował eventu.');ev=m.events[Math.floor(Math.random()*m.events.length)];kstate=null;$('k').textContent='nowa grupa — pierwsza akcja K=0';$('event').innerHTML='<h2>'+eventName(ev)+'</h2><small>'+ev.side+' · event '+ev.eventId+' · Z='+(ev.z??'—')+'</small>';$('actions').innerHTML='';const list=E.availableActions(ev.eventId,ev.z);if(!list.length)throw Error('Brak dostępnych akcji dla eventu '+ev.eventId+' Z='+ev.z);list.forEach(id=>{const b=document.createElement('button');b.textContent=(A[String(id)]?.name||id)+' ['+id+']';b.onclick=()=>go(String(id));$('actions').appendChild(b)});$('out').textContent='Wybierz akcję.';setStatus('Event wylosowany.',false)}catch(e){setStatus('BŁĄD: '+e.message,true);$('out').textContent=e.stack||e.message}}
function go(id){try{if(!ev)return; kstate=E.updateKState(kstate,ev.eventId);$('k').textContent='grupa '+kstate.eventGroup+' · iteracja '+kstate.repeatCount+' · K='+kstate.k;const r=E.resolveAction(id,{z:ev.z,k:kstate.k,performerStats:stats,opponentStats:stats});$('out').textContent='AKCJA: '+(A[id]?.name||id)+' ['+id+']\n\nBaza: '+r.base+'\n'+r.statTerms.map(t=>t.stat+' = '+t.value+' → '+t.term.toFixed(2)).join('\n')+'\n\nZ: '+(r.z??'—')+'\nWpływ Z: '+r.zModifier.toFixed(2)+'\nK: '+r.k+'\n\nP = '+r.probability.toFixed(2)+'%\nR = '+r.roll.toFixed(2)+'\n\nWYNIK: '+(r.success?'SUKCES':'PORAŻKA')}catch(e){$('out').textContent='BŁĄD: '+e.stack}}
$('new').onclick=next;
if(!E||typeof E.generateMatch!=='function'||typeof E.resolveAction!=='function')setStatus('BŁĄD: silnik/rozszerzenie 6C nie zostały załadowane.',true);
Promise.all([fetch('./data/akcje.json?v=4').then(r=>{if(!r.ok)throw Error('akcje.json HTTP '+r.status);return r.json()}),fetch('./data/eventy.json?v=4').then(r=>{if(!r.ok)throw Error('eventy.json HTTP '+r.status);return r.json()})]).then(([a,e])=>{A=a;EV=e;ready=true;setStatus('Bazy załadowane. Możesz kliknąć NOWY EVENT.',false)}).catch(e=>setStatus('BŁĄD ładowania baz: '+e.message,true));
})();</script></html>
